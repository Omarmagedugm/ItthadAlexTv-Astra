<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="refresh" content="0; url=/games/ittihadawy/index.html" />
  <title>لعبة اتحاداوي — حكايات زعيم الثغر</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #072418;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(16, 42, 37, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 4px;
      animation: bounce 1.5s infinite ease-in-out;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f7c933;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #ffdb5b;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #c9dbd2;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #ffec80, #f8c92b);
      color: #0d2b23;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(248, 201, 43, 0.3);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .subtext {
      font-size: 11px;
      color: #8fa89b;
    }
  </style>
  <script>
    // Direct and robust immediate navigation to the actual game
    const targetUrl = '/games/ittihadawy/index.html';
    try {
      window.location.replace(targetUrl);
    } catch (e) {
      window.location.href = targetUrl;
    }
    // Fallback timer if replace is blocked by browser
    setTimeout(function() {
      if (window.location.pathname.indexOf('ittihadawy') === -1) {
        window.location.href = targetUrl;
      }
    }, 150);
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">🎮</div>
    <div class="spinner"></div>
    <h1>جاري فتح لعبة «هروب اتحاداوي»...</h1>
    <p>لحظات ويتم تشغيل اللعبة في شوارع إسكندرية.</p>
    <a id="play-btn" class="btn" href="/games/ittihadawy/index.html">ابدأ اللعب الآن مباشرة ◀</a>
    <span class="subtext">إذا لم يتم تحويلك تلقائياً اضغط على الزر أعلاه</span>
  </div>
</body>
</html>
