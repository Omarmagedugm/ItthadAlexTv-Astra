<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#043828"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#043828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d49b7a"/>
      <stop offset="100%" stop-color="#b27352"/>
    </linearGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="greenShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="crab" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <circle cx="256" cy="200" r="220" fill="url(#glow)"/>

  <!-- Character Body: Green Shirt & White Vest -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Torso -->
    <path d="M 120 480 Q 130 360 210 340 L 302 340 Q 382 360 392 480 Z" fill="url(#greenShirt)"/>
    
    <!-- White Vest (Open waistcoat) -->
    <path d="M 120 480 Q 130 360 210 340 L 225 340 L 195 480 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 392 480 Q 382 360 302 340 L 287 340 L 317 480 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Vest Pinstripes -->
    <line x1="150" y1="390" x2="140" y2="480" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="180" y1="360" x2="165" y2="480" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="362" y1="390" x2="372" y2="480" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="332" y1="360" x2="347" y2="480" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Green Polo Collar -->
    <path d="M 215 340 L 256 375 L 297 340 Z" fill="#15803d"/>
    <path d="M 230 340 L 256 360 L 282 340 Z" fill="#ffffff"/>

    <!-- Neck -->
    <rect x="232" y="275" width="48" height="75" rx="14" fill="url(#skin)"/>
  </g>

  <!-- Face / Head -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="170" cy="235" r="24" fill="url(#skin)"/>
    <circle cx="170" cy="235" r="14" fill="#a16240" opacity="0.4"/>
    <circle cx="342" cy="235" r="24" fill="url(#skin)"/>
    <circle cx="342" cy="235" r="14" fill="#a16240" opacity="0.4"/>

    <!-- Head Shape -->
    <ellipse cx="256" cy="230" rx="82" ry="92" fill="url(#skin)"/>

    <!-- Cheerful Eyes -->
    <ellipse cx="218" cy="225" rx="11" ry="12" fill="#1e293b"/>
    <circle cx="215" cy="221" r="4" fill="#ffffff"/>
    <ellipse cx="294" cy="225" rx="11" ry="12" fill="#1e293b"/>
    <circle cx="291" cy="221" r="4" fill="#ffffff"/>

    <!-- Eyebrows -->
    <path d="M 198 205 Q 220 195 235 208" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 314 205 Q 292 195 277 208" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Friendly Nose -->
    <path d="M 256 220 Q 266 248 256 252 Q 246 248 256 220" fill="#a16240" opacity="0.4"/>
    <ellipse cx="256" cy="250" rx="12" ry="7" fill="#b27352"/>

    <!-- Wide Warm Egyptian Smile -->
    <path d="M 215 270 Q 256 308 297 270" stroke="#78350f" stroke-width="4" fill="#ffffff"/>
    <path d="M 218 272 Q 256 280 294 272" stroke="#e2e8f0" stroke-width="2" fill="none"/>
    <ellipse cx="196" cy="256" rx="12" ry="8" fill="#ef4444" opacity="0.2"/>
    <ellipse cx="316" cy="256" rx="12" ry="8" fill="#ef4444" opacity="0.2"/>
  </g>

  <!-- White Classic Fedora / Bucket Hat -->
  <g filter="url(#shadow)">
    <!-- Brim -->
    <ellipse cx="256" cy="168" rx="125" ry="32" fill="url(#hat)"/>
    <!-- Hat Crown -->
    <path d="M 172 165 C 170 100 200 80 256 80 C 312 80 342 100 340 165 Z" fill="url(#hat)"/>
    <path d="M 220 82 C 240 74 272 74 292 82 C 275 90 237 90 220 82 Z" fill="#94a3b8" opacity="0.3"/>
    
    <!-- Hat Green Ribbon -->
    <path d="M 172 152 Q 256 168 340 152 L 341 162 Q 256 178 171 162 Z" fill="#15803d"/>
    <!-- Small Ittihad Golden Badge on Hat -->
    <circle cx="256" cy="158" r="8" fill="url(#gold)"/>
    <polygon points="256,153 258,157 262,157 259,160 260,164 256,162 252,164 253,160 250,157 254,157" fill="#ffffff"/>
  </g>

  <!-- Abu Galambo (The Crab) 🦀 Special Ability Emblem -->
  <g transform="translate(330, 340)" filter="url(#shadow)">
    <!-- Glow behind crab -->
    <circle cx="50" cy="50" r="54" fill="#fef08a" opacity="0.25"/>
    <circle cx="50" cy="50" r="48" fill="#0f172a" stroke="url(#gold)" stroke-width="3"/>
    
    <!-- Crab Body -->
    <ellipse cx="50" cy="53" rx="26" ry="19" fill="url(#crab)"/>
    
    <!-- Crab Eyes -->
    <circle cx="42" cy="36" r="6" fill="#ffffff" stroke="#991b1b" stroke-width="1.5"/>
    <circle cx="42" cy="35" r="2.5" fill="#0f172a"/>
    <circle cx="58" cy="36" r="6" fill="#ffffff" stroke="#991b1b" stroke-width="1.5"/>
    <circle cx="58" cy="35" r="2.5" fill="#0f172a"/>

    <!-- Claws (Left & Right) -->
    <path d="M 26 48 Q 12 36 18 24 Q 28 26 28 38 Z" fill="url(#crab)"/>
    <path d="M 12 36 Q 6 22 16 20 Q 18 30 18 24" fill="#fca5a5"/>
    <path d="M 74 48 Q 88 36 82 24 Q 72 26 72 38 Z" fill="url(#crab)"/>
    <path d="M 88 36 Q 94 22 84 20 Q 82 30 82 24" fill="#fca5a5"/>

    <!-- Crab Legs -->
    <path d="M 30 58 Q 18 64 20 72" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 34 64 Q 24 72 28 80" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 70 58 Q 82 64 80 72" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 66 64 Q 76 72 72 80" stroke="#dc2626" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Crab Smile -->
    <path d="M 44 58 Q 50 63 56 58" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title Badge: حميدو البرنس -->
  <g transform="translate(256, 472)">
    <rect x="-100" y="-22" width="200" height="34" rx="17" fill="#022c22" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#fef08a">حميدو • أبو جلمبو 🦀</text>
  </g>
</svg>