<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <link rel="preload" href="/games/ittihadawy/fonts/alexandria-bold.ttf" as="font" type="font/ttf" crossorigin/>
  <meta name="theme-color" content="#064b38"/>
  <meta name="description" content="اتحاداوي — اختار شخصيتك وقدرتها الخاصة واهرب في شوارع إسكندرية"/>
  <title>اتحاداوي — حكايات زعيم الثغر</title>
  <script type="module" crossorigin src="/games/ittihadawy/assets/index-DDVEmsD_.js"></script>
  <link rel="stylesheet" crossorigin href="/games/ittihadawy/assets/index-CCqrBoST.css">
  <style>
    #exit-to-app-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(4, 36, 27, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.45);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    #exit-to-app-btn:hover {
      background: rgba(6, 78, 59, 0.95);
      border-color: #34d399;
      transform: scale(1.05);
      color: #fbbf24;
    }
    #exit-to-app-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <a id="exit-to-app-btn" href="/" onclick="handleExitToApp(event)" title="العودة لتطبيق قناة الاتحاد">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span>العودة للتطبيق</span>
  </a>

  <script>
    function handleExitToApp(e) {
      if (e) e.preventDefault();
      // If embedded in iframe
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'EXIT_GAME' }, '*');
          if (window.parent.location && window.parent.location.pathname.includes('/game')) {
            window.parent.location.href = '/';
            return;
          }
        } catch(err) {
          window.parent.location.href = '/';
          return;
        }
      }
      
      // If opened standalone
      if (window.opener) {
        window.close();
      } else {
        window.location.href = '/';
      }
    }
  </script>

  <div id="root"></div>
</body>
</html>
